name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          version=1.7.12
          archive="${RUNNER_TEMP}/actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -no-color

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run syntax and unit checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test packed package lifecycle
        run: npm run test:package

      - name: Verify publishable package contents
        run: npm run package:check

      - name: Smoke-test CLI entry points
        shell: bash
        run: |
          node src/index.js --help >/dev/null
          node src/index.js --version
          printf '%s\n' '{"hook_event_name":"SessionStart","session_id":"synthetic-ci-session"}' \
            | node src/index.js observe --agent claude-code --json >/dev/null

      - name: Reject unresolved merge-conflict markers
        shell: bash
        run: |
          if git grep -nI -E '^(<{7}|>{7}|\|{7})( |$)|^={7}$' -- .; then
            echo "::error::Unresolved Git merge-conflict markers were committed."
            exit 1
          fi
          echo "No unresolved merge-conflict markers found."

  coverage:
    name: Coverage (Codecov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Generate LCOV coverage report
        run: >-
          node --test
          --experimental-test-coverage
          --test-coverage-include='src/**/*.js'
          --test-reporter=lcov
          --test-reporter-destination=lcov.info
          test/*.test.js

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
          files: ./lcov.info
          use_oidc: true

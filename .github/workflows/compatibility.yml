name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  matrix:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.x
          - os: ubuntu-latest
            node: 24.x
          - os: ubuntu-latest
            node: 26.x
          - os: macos-latest
            node: 24.x
          - os: windows-latest
            node: 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

      - name: Test packed package lifecycle
        run: npm run test:package

  gate:
    name: Compatibility gate
    if: always()
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require matrix success
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Compatibility matrix result: $MATRIX_RESULT"
            exit 1
          fi
